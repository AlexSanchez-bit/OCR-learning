[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "matplotlib",
    "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["ml_lib*", "character_cnn*", "character_recognition_app*"]
